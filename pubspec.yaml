name: basic_project_setup
description: "This Project is the basic setup for a fresh project"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  dio: ^5.9.1
  shared_preferences: ^2.5.5
  equatable: ^2.0.8
  logger: ^2.6.2
  flutter_animate: ^4.5.2
  connectivity_plus: ^7.1.0
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  file_picker: ^10.3.10
  firebase_core: ^4.4.0
  skeletonizer: ^2.1.2
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.1
  flutter_dotenv: ^6.0.0
  fpdart: ^1.2.0
  permission_handler: ^12.0.1
  local_auth: ^3.0.1
  crypto: ^3.0.7
  flutter_secure_storage: ^10.0.0
  pinput: ^6.0.2
  cached_network_image: ^3.4.1
  lottie: ^3.3.2
  device_info_plus: ^12.4.0
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_hooks_lint: ^1.4.0

flutter:


  uses-material-design: true

  assets:
    - env/
    - assets/images/
    - assets/icons/
    - assets/animations/

